name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [templates-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v7

      - name: Checkout vt-templates for data
        uses: actions/checkout@v7
        with:
          repository: HappyHackingSpace/vt-templates
          path: vt-templates-data
          fetch-depth: 1
      
      - name: Prep assets
        run: |
          mkdir -p assets
          cp vt-templates-data/.assets/templates.json assets/templates.json
          rm -rf vt-templates-data

      # Static site generator (build.py): home, one pre-rendered page per lab at /VT-…/,
      # redirects for the old /vt-…/ and /detail.html?id= URLs, 404, sitemap, llms.txt, labs.json,
      # icons and per-lab OG images.
      - name: Build site
        run: |
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core   # fonts for the OG images
          pip install Pillow
          python3 build.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
