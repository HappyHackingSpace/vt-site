<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Hanken+Grotesk:wght@400&family=JetBrains+Mono:wght@500&display=block">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0F1217;}
.c{position:relative;width:1200px;height:630px;box-sizing:border-box;padding:84px 88px;
  background:radial-gradient(700px 420px at 86% 18%, rgba(232,56,74,.16), transparent 70%);}
.wm{font:800 34px 'Bricolage Grotesque',sans-serif;color:#F4F7FB;letter-spacing:-.02em;display:flex;align-items:center;gap:14px}
.wm svg{width:46px;height:46px}
h1{font:800 72px/1.06 'Bricolage Grotesque',sans-serif;color:#F4F7FB;letter-spacing:-.035em;margin:56px 0 0;max-width:700px}
.run{margin-top:44px;display:inline-block;font:500 26px 'JetBrains Mono',monospace;color:#F4F7FB;
  border:1px solid #262D38;background:#161A21;border-radius:9px;padding:16px 22px}
.run b{color:#EB5160;font-weight:500;margin-right:14px}
.url{position:absolute;left:88px;bottom:62px;font:400 22px 'Hanken Grotesk',sans-serif;color:#979FAB}
.mark{position:absolute;right:70px;top:150px;width:380px;height:380px;filter:drop-shadow(0 0 60px rgba(232,56,74,.28))}
</style></head><body><div class="c">
<div class="wm"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="#EFE4C9"/><circle cx="24" cy="24" r="13.5" fill="none" stroke="#0F1217" stroke-width="2.3"/><circle cx="24.6" cy="24.6" r="9" fill="none" stroke="#0F1217" stroke-width="2.1"/><circle cx="25.2" cy="25.2" r="5" fill="none" stroke="#0F1217" stroke-width="1.9"/><circle cx="25.6" cy="25.6" r="3" fill="#E8384A"/></svg>Vulnerable Target</div>
<h1>Spin up a vulnerable target from your terminal.</h1>
<div class="run"><b>$</b>vt start --id &lt;id&gt;</div>
<div class="url">vulnerabletarget.com</div>
<svg class="mark" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="#EFE4C9"/><circle cx="24" cy="24" r="13.5" fill="none" stroke="#0F1217" stroke-width="2.3"/><circle cx="24.6" cy="24.6" r="9" fill="none" stroke="#0F1217" stroke-width="2.1"/><circle cx="25.2" cy="25.2" r="5" fill="none" stroke="#0F1217" stroke-width="1.9"/><circle cx="25.6" cy="25.6" r="3" fill="#E8384A"/></svg>
</div></body></html>
